<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito | Maizon Toro</title>

    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="contenedor">

    <!-- Costales -->
    <img src="imagenes/bulto de maiz derecho.png" class="arroz izquierda">
    <img src="imagenes/bulto de maiz izquierdo.png" class="arroz derecha">

    <div class="login-box">

        <img src="imagenes/mazorca.png" class="logo-maiz">

        <h1>MAIZON TORO</h1>

        <p class="frase">
            "De nuestra familia para tu mesa"
        </p>

        <h2>Mi Carrito</h2>

        <div id="listaCarrito"></div>

        <div class="resumen">

            <div class="linea">
                <span>Subtotal:</span>
                <span id="subtotal">$0</span>
            </div>

            <div class="linea">
                <span>Domicilio:</span>
                <span>$5.000</span>
            </div>

            <div class="linea total">
                <span>Total:</span>
                <span id="total">$5.000</span>
            </div>

        </div>

        <br>

        <button onclick="finalizarCompra()">
            Finalizar compra
        </button>

        <button class="vaciar" onclick="vaciarCarrito()">
            Vaciar carrito
        </button>

        <br><br>

        <button onclick="window.location.href='productos.html'">
            ⬅ Seguir comprando
        </button>

        <p id="mensaje" class="mensaje"></p>

    </div>

</div>

<script src="../js/carrito.js"></script>

</body>
</html>
