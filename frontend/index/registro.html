<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | Maizon Toro</title>

    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="contenedor">

    <img src="imagenes/bulto de maiz derecho.png" class="arroz izquierda">

    <div class="login-box">

        <img src="imagenes/mazorca.png" class="logo-maiz">

        <h1>MAIZON TORO</h1>

        <p class="frase">
            "De nuestra familia para tu mesa"
        </p>

        <h2>Registro de Cliente</h2>

        <form id="formRegistro">

            <div class="campo">
                <label>Nombre:</label>
                <input type="text" id="nombre">
            </div>

            <div class="campo">
                <label>Documento:</label>
                <input type="text" id="documento">
            </div>

            <div class="campo">
                <label>Correo:</label>
                <input type="email" id="correo">
            </div>

            <div class="campo">
                <label>Teléfono:</label>
                <input type="text" id="telefono">
            </div>

            <div class="campo">
                <label>Dirección:</label>
                <input type="text" id="direccion">
            </div>

            <div class="campo">
                <label>Usuario:</label>
                <input type="text" id="usuarioRegistro">
            </div>

            <div class="campo">
                <label>Contraseña:</label>
                <input type="password" id="claveRegistro">
            </div>

            <div class="campo">
                <label>Confirmar contraseña:</label>
                <input type="password" id="confirmarClave">
            </div>

            <button type="submit">
                Registrarse
            </button>

        </form>

        <br>

        <button onclick="window.location.href='index.html'">
            Volver al inicio
        </button>

    </div>

    <img src="imagenes/bulto de maiz izquierdo.png" class="arroz derecha">

</div>

<script src="../js/registro.js"></script>
</body>
</html>
