<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maizon Toro</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <div class="contenedor">

        <!-- Costal izquierdo -->
        <img src="imagenes/bulto de maiz derecho.png"
            class="arroz izquierda">

        <!-- Contenido -->
        <div class="login-box">

            <img src="imagenes/mazorca.png"
                class="logo-maiz">

            <h1>MAIZON TORO</h1>

            <p class="frase">
                "De nuestra familia para tu mesa"
            </p>

            <h2>Inicio de sesión</h2>

            <form id="formulario">

                <div class="campo">
                    <label>Usuario:</label>
                    <input type="text" id="usuario">
                </div>

                <div class="campo">
                    <label>Contraseña:</label>
                    <input type="password" id="clave">
                </div>

                <button type="submit">
                    Iniciar sesión
                </button>

            </form>

            <p class="olvido">
                ¿Olvidó su contraseña?
            </p>
               <br><br>

<button type="button" onclick="window.location.href='registro.html'">
    Registrarse
</button>
        </div>

        <!-- Costal derecho -->
        <img src="imagenes/bulto de maiz izquierdo.png"
            class="arroz derecha">

    </div>

    <script src="../js/script.js"></script>

</body>

</html>
